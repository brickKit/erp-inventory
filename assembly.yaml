id: erp/inventory                    # 必须与 component.yaml 一致，be-ops 校验
version: 1.0.0

asset:
  source_type: open_standard
  assembly_role: default
  contract_lock: strict
  customization_guide: |
    仓库/库位模型、防超卖策略或预留规则超出标准版时：
    1. 主管理员在客户电脑本地复制本目录为定制目录（如 erp-inventory-acme），改 git remote。
    2. 用 AI 在 backend/ 生成定制业务代码。
    3. 严禁对 contracts/ 做破坏性变更；只允许在末尾追加新字段、使用新 Tag 编号——
       下游 erp-sales/erp-purchase/erp-manufacturing 都消费这份契约（§3.4 铁律 3）。
    4. 把定制目录声明成 local 安装源并排在标准源前面（§3.4.1 遮蔽机制）。
    ⚠️ metadata.id 与 version 一个字都不能改——改了所有依赖方的
       ERP_INVENTORY_ENDPOINT 会整个消失。

domain: erp
tier: backend

edge_routes:
  - { path: /erp/inventory/**, auth: required }

menus:
  - { key: erp.inventory, title: 库存管理, permission: erp.inventory.view }

data:
  schema: erp_inventory               # registry/schemas.tsv
  role:   erp_inventory_rw            # 只用于 SET LOCAL ROLE，从不登录，因此不进 brickkit.yaml

# warehouse 维（设计计划 §1、设计书 §14.2.2）：分仓管理的客户里，华东仓管理员
# 不该看到华南仓库存明细。⚠️ warehouse_id 本来就是业务主键的一部分，不需要
# 额外的 dept_id/dept_path/owner_id 三列——那三列是给 org/owner 两维用的。
data_scopes:
  - { dimension: warehouse, column: warehouse_id, mode: in,
      tables: [inventory_balances, inventory_movements, inventory_reservations] }

permissions:
  - { key: erp.inventory.view,    title: 查看库存,     type: page   }
  - { key: erp.inventory.reserve, title: 预留库存,     type: action }
  - { key: erp.inventory.issue,   title: 确认出库,     type: action }
  - { key: erp.inventory.receive, title: 入库,         type: action }
  - { key: erp.inventory.adjust,  title: 盘盈盘亏调整, type: action }

shell: go-core                       # 合并部署时进外壳一（§13.2）
