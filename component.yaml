apiVersion: brickkit/v1
kind: Component

metadata:
  id: erp/inventory
  name: Inventory
  version: 2.0.0
  description: Stock balances, movements and reservations, with oversell protection; the only writer of physical stock movements.
  repository: https://github.com/brickKit/erp-inventory
  license: Apache-2.0
  vendor: brickKit

tags: [erp, inventory, warehouse]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/erp/inventory/v1/inventory.proto, contracts/events/inventory.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/inventory.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: []

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: erp_inventory}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
    LOW_STOCK_THRESHOLD: {type: string, default: "10"}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8086
  extraPorts:
    - {name: grpc, port: 9096}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 200m, memory: 256Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]
